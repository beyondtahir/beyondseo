name: Feature request
description: Suggest a concrete improvement.
labels: [enhancement]
body:
  - type: textarea
    id: outcome
    attributes:
      label: What are you trying to achieve?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example input and desired result
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
