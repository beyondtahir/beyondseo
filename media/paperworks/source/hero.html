<!doctype html><html lang="en"><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap">
<style>
*{box-sizing:border-box;margin:0}body{background:#111;font-family:Nunito,Arial,sans-serif}
section{position:relative;overflow:hidden;background:#111;color:#fff}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(170,30,30,.65),rgba(17,17,17,0) 68%)}
.logo{border-radius:16px;display:block;height:auto;clip-path:inset(9% 7% round 16px)}
h1{font-weight:900;letter-spacing:-2.5px;line-height:1.02}h1 em{font-style:normal;color:#ff5a52}
p{font-weight:700;color:#d8d3ce;line-height:1.3}
.world{position:absolute;perspective:1500px}
.tilt,.cube,.mini{position:absolute;transform-style:preserve-3d}
.tilt{transform:rotateX(-14deg)}.cube{inset:0;transform:rotateY(-24deg)}
.f{position:absolute;inset:0;background:#f5f3f1;border:3px solid #d9d2ca;overflow:hidden;backface-visibility:hidden;color:#151515}
.lid{background:#991b1b;border-color:#7a1414}
.m{position:absolute;inset:0;background:#f5f3f1;border:3px solid #cfc7be;display:flex;align-items:center;justify-content:center;color:#151515;font-weight:900;backface-visibility:hidden}.m.s{background:#d9d2ca}.m.t{background:#e6e0d9}
.tick{position:absolute;right:-13px;top:-13px;width:46px;height:46px;border-radius:50%;background:#991b1b;color:#fff;text-align:center;line-height:44px;font-size:29px}
.mini{width:120px;height:120px;transform:rotateX(-18deg) rotateY(28deg)}.mini .m{font-size:20px}
.shadow{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.8),rgba(0,0,0,0) 72%)}
#desktop{width:1600px;height:640px}#desktop .glow{left:690px;top:-300px;width:1100px;height:1100px}
#desktop .logo{position:absolute;left:58px;top:36px;width:320px}#desktop h1{position:absolute;left:72px;top:176px;font-size:84px;width:720px}
#desktop p{position:absolute;left:76px;top:458px;font-size:33px;width:690px}
#mobile{width:800px;height:1040px}#mobile .glow{left:-160px;top:320px;width:1120px;height:900px}
#mobile .logo{position:absolute;left:34px;top:18px;width:320px}#mobile h1{position:absolute;left:48px;top:150px;font-size:76px;width:710px}
#mobile p{position:absolute;left:52px;top:408px;font-size:31px;width:690px}
</style>
<script>
function box(id,size,cx,cy,o){const h=size/2;const M=(l,x,y)=>`<div class="mini" style="left:${x}px;top:${y}px"><div class="m" style="transform:translateZ(60px)">${l}<div class="tick">✓</div></div><div class="m s" style="transform:rotateY(90deg) translateZ(60px)"></div><div class="m s" style="transform:rotateY(-90deg) translateZ(60px)"></div><div class="m t" style="transform:rotateX(90deg) translateZ(60px)"></div></div>`;
const w=document.getElementById(id);w.insertAdjacentHTML('beforeend',`<div class="shadow" style="left:${cx-size*.55}px;top:${cy+size*.62}px;width:${size*1.1}px;height:${size*.13}px"></div><div class="world" style="inset:0;perspective-origin:${cx}px ${cy-70}px">${o.map(a=>M(...a)).join('')}<div class="tilt" style="left:${cx-h}px;top:${cy-h}px;width:${size}px;height:${size}px"><div class="cube"><div class="f" style="transform:translateZ(${h}px)"><img src="../seo-house.png" style="position:absolute;left:${-size*.25}px;top:0;height:100%"></div><div class="f" style="transform:rotateY(90deg) translateZ(${h}px)"><img src="explainer/assets/sprites/scan-3.png" style="position:absolute;left:12%;top:18%;height:70%"></div><div class="f lid" style="transform:rotateX(90deg) translateZ(${h}px)"></div></div></div></div>`)}
</script>
<section id="desktop"><div class="glow"></div><img class="logo" src="../wordmark.png" alt=""><h1>Help customers find you on <em>Google and AI.</em></h1><p>Tell your AI one sentence. Get a clear plan, useful words and checked fixes.</p></section>
<section id="mobile"><div class="glow"></div><img class="logo" src="../wordmark.png" alt=""><h1>Help customers find you on <em>Google and AI.</em></h1><p>Tell your AI one sentence. Get a clear plan, useful words and checked fixes.</p></section>
<script>box('desktop',370,1190,300,[['Home',800,60],['Rivals',1420,40],['Backlinks',1430,420],['Pages',790,440]]);box('mobile',310,400,740,[['Home',28,530],['Rivals',635,520],['Backlinks',628,860],['Pages',36,860]]);</script>
</html>
