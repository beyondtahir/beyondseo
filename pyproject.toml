[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "beyondseo"
version = "2.10.0"
description = "An open-source AI SEO skill for website audits, SEO/AEO/GEO, content, competitor research and backlinks, with its own crawler."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{name = "Muhammad Tahir Ashraf — Beyond Tahir"}]
dependencies = ["beautifulsoup4>=4.12,<5", "colorama>=0.4.6,<0.5"]
keywords = ["seo", "ai-seo", "aeo", "geo", "website-audit", "backlinks", "content-strategy", "web-crawler"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.optional-dependencies]
google = ["google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3"]
browser = ["playwright>=1.48,<2"]
reports = ["reportlab>=4.2,<5"]
sftp = ["paramiko>=3.4,<5"]
dev = ["ruff>=0.11,<1", "reportlab>=4.2,<5", "pypdf>=5,<7", "google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3"]
hosting-test = ["paramiko>=3.4,<5", "pyftpdlib>=2,<3", "pyOpenSSL>=24,<27"]

[project.scripts]
beyondseo = "beyondseo.cli:main"

[project.urls]
Author = "https://beyondtahir.com"
Repository = "https://github.com/beyondtahir/beyondseo"
Documentation = "https://github.com/beyondtahir/beyondseo/blob/main/docs/README.md"
Issues = "https://github.com/beyondtahir/beyondseo/issues"
Changelog = "https://github.com/beyondtahir/beyondseo/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beyondseo = ["report_assets/*.png", "report_assets/*.css"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
